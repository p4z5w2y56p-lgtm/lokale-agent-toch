[project]
name = "agent-trader"
version = "0.1.0"
description = "A safety-first, staged-training crypto trading agent (paper trading first)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
testnet = ["web3>=7"]

[project.scripts]
agent-trader = "agent_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_trader", "agent_trader.research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
